name: flask_pipeline1

on:
  push:
    branches:
      - main

jobs:
  python_app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: setting up python in our runner
        uses: actions/setup-python@v6
        with:
          python-version: '3.13' 

      - name: Installing dependencies regarding to our application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Running the flask app
        run: python app.py

      - name: Setting up a test case
        run: |
          echo "Starting the test phase using Curl command."
          curl http://127.0.0.1:5000
          echo "The testing has been completed!"
        
          
